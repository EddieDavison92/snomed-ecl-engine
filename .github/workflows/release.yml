name: Release

# A v* tag builds every platform and publishes to GitHub Releases, crates.io,
# npm, the Homebrew tap and ghcr.io. A pull request that touches packaging runs
# the same builds and packaging without publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "install.sh"
      - "install.ps1"
      - "Cargo.toml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$PUBLISH" = true ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Debian bookworm, so Linux executables need glibc 2.36 or later.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            container: rust:1.93.1-bookworm
            variants: query default unicode
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: rust:1.93.1-bookworm
            variants: query default unicode
          - target: aarch64-apple-darwin
            runner: macos-14
            variants: query default
          - target: x86_64-apple-darwin
            runner: macos-14
            variants: query default
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            variants: query default
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ICU
        if: contains(matrix.variants, 'unicode')
        run: |
          apt-get update -qq
          apt-get install -y -qq libicu-dev pkg-config >/dev/null
      - name: Add the target
        shell: bash
        run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build and package
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          suffix=""; [ "$TARGET" = x86_64-pc-windows-msvc ] && suffix=.exe
          for variant in ${{ matrix.variants }}; do
            case $variant in
              query) flags=--no-default-features ;;
              default) flags= ;;
              unicode) flags="--features unicode" ;;
            esac
            cargo build --locked --release --target "$TARGET" $flags --target-dir "target/$variant"
            name="snomed-ecl-engine-v$VERSION-$TARGET-$variant"
            mkdir "$name"
            cp "target/$variant/$TARGET/release/snomed-ecl-engine$suffix" README.md LICENSE "$name/"
            if [ -n "$suffix" ]; then
              7z a -tzip -bso0 "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$name"
          done
          ls -l dist
      - name: Run the executable
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          suffix=""; [ "$TARGET" = x86_64-pc-windows-msvc ] && suffix=.exe
          "target/default/$TARGET/release/snomed-ecl-engine$suffix" --version
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github:
    name: GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # crates.io and npm trust this workflow by OIDC, so neither needs a stored token.
  crates:
    name: crates.io
    needs: [version, github]
    runs-on: ubuntu-latest
    container: rust:1.93.1-bookworm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: cargo publish --locked --dry-run
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.PUBLISH == 'true'
        id: auth
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  npm:
    name: npm
    needs: [version, github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm
        # Trusted publishing needs npm 11.5.1 or later.
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Build the packages
        run: node packaging/npm/packages.mjs "$VERSION" dist npm-dist
      - name: Check the launcher
        run: |
          mkdir -p npm-check/node_modules
          cp -r npm-dist/snomed-ecl-engine-linux-x64 npm-check/node_modules/
          cp -r npm-dist/snomed-ecl-engine npm-check/node_modules/
          node npm-check/node_modules/snomed-ecl-engine/bin/snomed-ecl-engine.js --version
      - name: Pack
        run: for dir in npm-dist/*/; do (cd "$dir" && npm pack --dry-run); done
      - name: Publish
        if: env.PUBLISH == 'true'
        # Platform packages first, so the launcher never points at a missing
        # one. A version already on the registry is skipped, so a rerun is safe.
        run: |
          for dir in npm-dist/snomed-ecl-engine-*/ npm-dist/snomed-ecl-engine/; do
            name=$(node -p "require('./$dir/package.json').name")
            # Compare the answer, so a failed lookup is not mistaken for a published version.
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already published"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done

  homebrew:
    name: Homebrew tap
    needs: [version, github]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Write the formula
        run: |
          sh packaging/homebrew/formula.sh "$VERSION" dist/SHA256SUMS > snomed-ecl-engine.rb
          ruby -c snomed-ecl-engine.rb
      - name: Publish
        if: env.PUBLISH == 'true' && env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/EddieDavison92/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp snomed-ecl-engine.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/snomed-ecl-engine.rb
          git commit -m "snomed-ecl-engine $VERSION"
          git push

  container:
    name: Container image
    needs: [version, github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Stage the executables
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}-unknown-linux-gnu
            name="snomed-ecl-engine-v$VERSION-$target-unicode"
            mkdir -p "dist/docker/$arch"
            tar -xzf "dist/$name.tar.gz" -C dist
            cp "dist/$name/snomed-ecl-engine" "dist/docker/$arch/"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/eddiedavison92/snomed-ecl-engine:${{ env.VERSION }}
            ghcr.io/eddiedavison92/snomed-ecl-engine:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Evaluate SNOMED CT ECL against a local index
            org.opencontainers.image.licenses=MIT
