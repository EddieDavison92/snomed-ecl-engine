[package]
name = "snomed-ecl-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false
description = "Compact SNOMED CT ECL engine and RF2 index builder"
repository = "https://github.com/EddieDavison92/snomed-ecl-engine"
keywords = ["snomed", "ecl", "terminology", "rf2"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8.6", optional = true, default-features = false, features = ["deflate"] }

[features]
default = ["import"]
import = ["dep:zip"]
unicode = ["dep:cc", "dep:pkg-config"]

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
