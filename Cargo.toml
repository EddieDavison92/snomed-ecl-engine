[package]
name = "snomed-ecl-engine"
version = "0.1.2"
edition = "2021"
rust-version = "1.93"
description = "Compact SNOMED CT ECL engine and RF2 index builder"
license = "MIT"
readme = "README.md"
categories = ["command-line-utilities", "science"]
repository = "https://github.com/EddieDavison92/snomed-ecl-engine"
keywords = ["snomed", "ecl", "terminology", "rf2"]
# Source only: the evidence under validation/ and the charts stay in the repository.
include = ["/src", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

# `cargo binstall snomed-ecl-engine` fetches the release executable instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }-default{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }-default/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13.3", default-features = false }
zip = { version = "8.6", optional = true, default-features = false, features = ["deflate"] }
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls"] }

[features]
default = ["import", "download"]
import = ["dep:zip", "zstd/zdict_builder"]
# Fetch releases from NHS England TRUD; needs the importer to build them.
download = ["import", "dep:ureq"]
unicode = ["dep:cc", "dep:pkg-config"]

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
