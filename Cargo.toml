[package]
name = "snomed-rust-ecl-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false
description = "Experimental compact RF2 store and ECL engine"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
