<text x="24" y="418" font-size="11" fill="#52514e">Snowstorm caches an expansion once asked, so its second answer is far quicker than its first. This engine has no</text>
<text x="24" y="431" font-size="11" fill="#52514e">result cache; every ask costs the same. Opening the index is a separate one-off of about 155 ms per process.</text>
