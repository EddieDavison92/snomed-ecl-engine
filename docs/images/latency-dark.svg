<svg xmlns="http://www.w3.org/2000/svg" width="720" height="454" viewBox="0 0 720 454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Asking for a total, and asking for every code">
<rect width="720" height="454" fill="#1a1a19"/>
<text x="24" y="28" font-size="16" font-weight="600" fill="#ffffff">Asking for a total, and asking for every code</text>
<text x="24" y="48" font-size="12" fill="#c3c2b7">Median over the 1,000-expression corpus, on each server's matched cohort.</text>
<text x="24" y="74" font-size="12.5" font-weight="600" fill="#ffffff">Warm count — total only</text>
<text x="138" y="108.0" font-size="12" text-anchor="end" fill="#c3c2b7">This engine</text>
<text x="138" y="121.0" font-size="10" text-anchor="end" fill="#c3c2b7">1 CPU, 256 MiB</text>
<path d="M150,98.0 H225.05989385898408 A4,4 0 0 1 229.05989385898408,102.0 V116.0 A4,4 0 0 1 225.05989385898408,120.0 H150 Z" fill="#3987e5"/>
<text x="239.05989385898408" y="113.0" font-size="12" font-weight="600" fill="#ffffff">2.20 ms</text>
<text x="138" y="150.0" font-size="12" text-anchor="end" fill="#c3c2b7">Snowstorm Lite</text>
<text x="138" y="163.0" font-size="10" text-anchor="end" fill="#c3c2b7">1 CPU, 2 GiB</text>
<path d="M150,140.0 H309.8695981804397 A4,4 0 0 1 313.8695981804397,144.0 V158.0 A4,4 0 0 1 309.8695981804397,162.0 H150 Z" fill="#d95926"/>
<text x="323.8695981804397" y="155.0" font-size="12" font-weight="600" fill="#ffffff">4.56 ms</text>
<text x="138" y="192.0" font-size="12" text-anchor="end" fill="#c3c2b7">Snowstorm</text>
<text x="138" y="205.0" font-size="10" text-anchor="end" fill="#c3c2b7">8 CPUs, 12 GiB</text>
<path d="M150,182.0 H620.0 A4,4 0 0 1 624.0,186.0 V200.0 A4,4 0 0 1 620.0,204.0 H150 Z" fill="#199e70"/>
<text x="634.0" y="197.0" font-size="12" font-weight="600" fill="#ffffff">13.19 ms</text>
<line x1="150" y1="86" x2="150" y2="212" stroke="#383835" stroke-width="1"/>
<text x="24" y="248" font-size="12.5" font-weight="600" fill="#ffffff">Complete enumeration — every code returned</text>
<text x="138" y="282.0" font-size="12" text-anchor="end" fill="#c3c2b7">This engine</text>
<text x="138" y="295.0" font-size="10" text-anchor="end" fill="#c3c2b7">1 CPU, 256 MiB</text>
<path d="M150,272.0 H175.82032967032967 A4,4 0 0 1 179.82032967032967,276.0 V290.0 A4,4 0 0 1 175.82032967032967,294.0 H150 Z" fill="#3987e5"/>
<text x="189.82032967032967" y="287.0" font-size="12" font-weight="600" fill="#ffffff">2.29 ms</text>
<text x="138" y="324.0" font-size="12" text-anchor="end" fill="#c3c2b7">Snowstorm Lite</text>
<text x="138" y="337.0" font-size="10" text-anchor="end" fill="#c3c2b7">1 CPU, 2 GiB</text>
<path d="M150,314.0 H239.1071428571429 A4,4 0 0 1 243.1071428571429,318.0 V332.0 A4,4 0 0 1 239.1071428571429,336.0 H150 Z" fill="#d95926"/>
<text x="253.1071428571429" y="329.0" font-size="12" font-weight="600" fill="#ffffff">7.15 ms</text>
<text x="138" y="366.0" font-size="12" text-anchor="end" fill="#c3c2b7">Snowstorm</text>
<text x="138" y="379.0" font-size="10" text-anchor="end" fill="#c3c2b7">8 CPUs, 12 GiB</text>
<path d="M150,356.0 H620.0 A4,4 0 0 1 624.0,360.0 V374.0 A4,4 0 0 1 620.0,378.0 H150 Z" fill="#199e70"/>
<text x="634.0" y="371.0" font-size="12" font-weight="600" fill="#ffffff">36.40 ms</text>
<line x1="150" y1="260" x2="150" y2="386" stroke="#383835" stroke-width="1"/>
<text x="24" y="426" font-size="11" fill="#c3c2b7">Engine cost is flat between the two; server cost is not. Snowstorm's allocation covers its service and</text>
<text x="24" y="440" font-size="11" fill="#c3c2b7">Elasticsearch together. Includes transport: JSONL to a child process, or loopback HTTP with paging.</text>
</svg>
