<text x="557.8" y="177.1" font-size="11" font-weight="600" fill="#ffffff">Snowstorm, cached</text>
<text x="24" y="418" font-size="11" fill="#c3c2b7">Snowstorm caches an expansion once asked, so its second answer is far quicker than its first. This engine has no</text>
<text x="24" y="431" font-size="11" fill="#c3c2b7">result cache; every ask costs the same. Opening the index is a separate one-off of 285 to 525 ms.</text>
