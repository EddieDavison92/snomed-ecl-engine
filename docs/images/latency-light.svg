<text x="24" y="28" font-size="16" font-weight="600" fill="#0b0b0b">Asking for a total, and asking for every code</text>
<text x="24" y="48" font-size="12" fill="#52514e">Median over the 1,000-expression corpus, on each server's matched cohort.</text>
