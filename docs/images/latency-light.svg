<text x="24" y="426" font-size="11" fill="#52514e">Engine cost is flat between the two; server cost is not. Snowstorm's allocation covers its service and</text>
<text x="24" y="440" font-size="11" fill="#52514e">Elasticsearch together. Includes transport: JSONL to a child process, or loopback HTTP with paging.</text>
