<svg xmlns="http://www.w3.org/2000/svg" width="720" height="556" viewBox="0 0 720 556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Setting up and serving one UK release">
